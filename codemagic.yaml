workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 20
      xcode: 26.4
      cocoapods: default
      groups:
        - deafault

    scripts:

      # ─────────────────────────────────────────────
      # 1. Install JS dependencies
      # ─────────────────────────────────────────────
      - name: Install dependencies
        script: npm install

      # ─────────────────────────────────────────────
      # 2. Bump build number from TestFlight
      # ─────────────────────────────────────────────
      - name: Increment build number
        script: |
          cd ios
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number 6770657257)
          NEXT=$((BUILD_NUMBER + 1))
          agvtool new-version -all $NEXT

      # ─────────────────────────────────────────────
      # 3. Create PacketTunnel files + configure Xcode project
      # ─────────────────────────────────────────────
      - name: Setup PacketTunnel Target
        script: |
          cd ios
          mkdir -p PacketTunnel

          # ── Entitlements ──
          cat > PacketTunnel/PacketTunnel.entitlements << 'ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.developer.networking.vpn.api</key>
              <array>
                  <string>allow-vpn</string>
              </array>
          </dict>
          </plist>
          ENTITLEMENTS

          # ── Info.plist ──
          cat > PacketTunnel/Info.plist << 'INFOPLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>PacketTunnel</string>
              <key>CFBundleName</key>
              <string>PacketTunnel</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundlePackageType</key>
              <string>XPC!</string>
              <key>NSExtension</key>
              <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.networkextension.packet-tunnel</string>
                  <key>NSExtensionPrincipalClass</key>
                  <string>$(PRODUCT_MODULE_NAME).PacketTunnelProvider</string>
              </dict>
          </dict>
          </plist>
          INFOPLIST

          # ── Swift source with manual wg‑quick parser ──
          cat > PacketTunnel/PacketTunnelProvider.swift << 'SWIFTFILE'
          import Foundation
          import NetworkExtension
          import WireGuardKit

          extension TunnelConfiguration {
              static func fromWgQuickConfig(_ config: String, called name: String?) throws -> TunnelConfiguration {
                  let dummyPrivateKey = PrivateKey(base64Key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=")!
                  let dummyPublicKey = PublicKey(base64Key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=")!

                  var interface = InterfaceConfiguration(privateKey: dummyPrivateKey)
                  var peers: [PeerConfiguration] = []
                  var currentPeer: PeerConfiguration?
                  var currentSection = ""

                  let lines = config.split(separator: "\n").map { String($0) }
                  for line in lines {
                      let trimmed = line.trimmingCharacters(in: .whitespaces)
                      if trimmed.isEmpty || trimmed.hasPrefix("#") { continue }

                      if trimmed.hasPrefix("[") && trimmed.hasSuffix("]") {
                          let section = String(trimmed.dropFirst().dropLast())
                          currentSection = section
                          if section == "Peer" {
                              if let peer = currentPeer {
                                  peers.append(peer)
                              }
                              currentPeer = PeerConfiguration(publicKey: dummyPublicKey)
                          } else if section == "Interface" {
                              interface = InterfaceConfiguration(privateKey: dummyPrivateKey)
                          }
                          continue
                      }

                      guard let (key, value) = parseKeyValue(line: trimmed) else { continue }

                      switch currentSection {
                      case "Interface":
                          switch key {
                          case "PrivateKey":
                              if let privateKey = PrivateKey(base64Key: value) {
                                  interface.privateKey = privateKey
                              }
                          case "Address":
                              let addresses = value.split(separator: ",").compactMap {
                                  IPAddressRange(from: String($0))
                              }
                              interface.addresses = addresses
                          case "DNS":
                              let dnsServers = value.split(separator: ",").compactMap {
                                  DNSServer(from: String($0))
                              }
                              interface.dns = dnsServers
                          case "MTU":
                              if let mtu = UInt16(value) { interface.mtu = mtu }
                          case "ListenPort":
                              if let port = UInt16(value) { interface.listenPort = port }
                          default: break
                          }

                      case "Peer":
                          guard var peer = currentPeer else { continue }
                          switch key {
                          case "PublicKey":
                              if let publicKey = PublicKey(base64Key: value) {
                                  peer.publicKey = publicKey
                              }
                          case "PresharedKey":
                              if let preSharedKey = PreSharedKey(base64Key: value) {
                                  peer.preSharedKey = preSharedKey
                              }
                          case "AllowedIPs":
                              let allowed = value.split(separator: ",").compactMap {
                                  IPAddressRange(from: String($0))
                              }
                              peer.allowedIPs = allowed
                          case "Endpoint":
                              if let endpoint = Endpoint(from: value) {
                                  peer.endpoint = endpoint
                              }
                          case "PersistentKeepalive":
                              if let interval = UInt16(value) {
                                  peer.persistentKeepAlive = interval
                              }
                          default: break
                          }
                          currentPeer = peer

                      default: break
                      }
                  }

                  if let peer = currentPeer {
                      peers.append(peer)
                  }

                  guard interface.privateKey != dummyPrivateKey else {
                      throw NSError(domain: "WireGuard", code: -1,
                                    userInfo: [NSLocalizedDescriptionKey: "Missing PrivateKey in [Interface]"])
                  }

                  return TunnelConfiguration(name: name, interface: interface, peers: peers)
              }

              private static func parseKeyValue(line: String) -> (key: String, value: String)? {
                  let parts = line.split(separator: "=", maxSplits: 1).map { String($0) }
                  guard parts.count == 2 else { return nil }
                  return (parts[0].trimmingCharacters(in: .whitespaces),
                          parts[1].trimmingCharacters(in: .whitespaces))
              }
          }

          class PacketTunnelProvider: NEPacketTunnelProvider {
              private lazy var adapter = WireGuardAdapter(with: self) { _, message in
                  NSLog("[WireGuard] \(message)")
              }

              override func startTunnel(
                  options: [String: NSObject]?,
                  completionHandler: @escaping (Error?) -> Void
              ) {
                  guard
                      let proto = protocolConfiguration as? NETunnelProviderProtocol,
                      let cfg = proto.providerConfiguration,
                      let wgCfg = cfg["wgQuickConfig"] as? String,
                      !wgCfg.isEmpty
                  else {
                      completionHandler(VPNError.missingConfig)
                      return
                  }

                  let tunnelName = (cfg["tunnelName"] as? String) ?? "nerox"

                  let tunnelConfig: TunnelConfiguration
                  do {
                      tunnelConfig = try TunnelConfiguration.fromWgQuickConfig(wgCfg, called: tunnelName)
                  } catch {
                      completionHandler(error)
                      return
                  }

                  adapter.start(tunnelConfiguration: tunnelConfig) { adapterError in
                      if let adapterError = adapterError {
                          NSLog("[WireGuard] start error: \(adapterError)")
                          completionHandler(adapterError)
                      } else {
                          completionHandler(nil)
                      }
                  }
              }

              override func stopTunnel(
                  with reason: NEProviderStopReason,
                  completionHandler: @escaping () -> Void
              ) {
                  adapter.stop { _ in completionHandler() }
              }

              override func handleAppMessage(
                  _ messageData: Data,
                  completionHandler: ((Data?) -> Void)?
              ) {
                  guard
                      let msg = String(data: messageData, encoding: .utf8),
                      msg == "getTransferredByteCount"
                  else {
                      completionHandler?(nil)
                      return
                  }

                  adapter.getRuntimeConfiguration { cfgString in
                      guard let cfgString = cfgString else {
                          completionHandler?(nil)
                          return
                      }

                      var rx: UInt64 = 0
                      var tx: UInt64 = 0

                      for line in cfgString.split(separator: "\n") {
                          let t = line.trimmingCharacters(in: .whitespaces)
                          if t.hasPrefix("rx_bytes=") {
                              rx += UInt64(t.dropFirst("rx_bytes=".count)) ?? 0
                          } else if t.hasPrefix("tx_bytes=") {
                              tx += UInt64(t.dropFirst("tx_bytes=".count)) ?? 0
                          }
                      }

                      let data = try? JSONSerialization.data(
                          withJSONObject: ["totalReceived": rx, "totalSent": tx]
                      )
                      completionHandler?(data)
                  }
              }
          }

          enum VPNError: LocalizedError {
              case missingConfig
              var errorDescription: String? {
                  "Missing wgQuickConfig in providerConfiguration"
              }
          }
          SWIFTFILE

          # ── xcodeproj gem + Ruby script ──
          gem install xcodeproj --quiet

          ruby << 'RUBYSCRIPT'
          require 'xcodeproj'

          TEAM_ID        = '6ZN7399P3U'
          MAIN_BUNDLE_ID = 'org.reactjs.native.example.Nerox'
          PKT_BUNDLE_ID  = "#{MAIN_BUNDLE_ID}.PacketTunnel"
          MAIN_PROFILE   = '4250a012-2d5e-4164-a0d9-3c6b59950937'
          PKT_PROFILE    = 'ba9b8b32-6949-4963-a3a3-f3e7c6a50d94'
          WG_URL         = 'https://git.zx2c4.com/wireguard-apple'
          WG_VERSION     = '1.0.15-26'

          def configure_main(target)
            target.build_configurations.each do |c|
              c.build_settings['CODE_SIGN_STYLE']                = 'Manual'
              c.build_settings['DEVELOPMENT_TEAM']               = TEAM_ID
              c.build_settings['PRODUCT_BUNDLE_IDENTIFIER']      = MAIN_BUNDLE_ID
              c.build_settings['CODE_SIGN_ENTITLEMENTS']         = 'Nerox/Nerox.entitlements'
              c.build_settings['PROVISIONING_PROFILE']           = MAIN_PROFILE
              c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = MAIN_PROFILE
            end
          end

          def configure_packet(target)
            target.build_configurations.each do |c|
              c.build_settings['SWIFT_VERSION']                  = '5.0'
              c.build_settings['IPHONEOS_DEPLOYMENT_TARGET']     = '15.0'
              c.build_settings['CODE_SIGN_STYLE']                = 'Manual'
              c.build_settings['DEVELOPMENT_TEAM']               = TEAM_ID
              c.build_settings['PRODUCT_NAME']                   = 'PacketTunnel'
              c.build_settings['PRODUCT_BUNDLE_IDENTIFIER']      = PKT_BUNDLE_ID
              c.build_settings['CODE_SIGN_ENTITLEMENTS']         = 'PacketTunnel/PacketTunnel.entitlements'
              c.build_settings['GENERATE_INFOPLIST_FILE']        = 'NO'
              c.build_settings['INFOPLIST_FILE']                 = 'PacketTunnel/Info.plist'
              c.build_settings['PROVISIONING_PROFILE']           = PKT_PROFILE
              c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = PKT_PROFILE

              # 🔧 Force linker to find libwg-go.a
              c.build_settings['OTHER_LDFLAGS'] = '$(inherited) -lwg-go'
              c.build_settings['LIBRARY_SEARCH_PATHS'] = '$(inherited) "$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)" "$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/PackageFrameworks"'
              c.build_settings['FRAMEWORK_SEARCH_PATHS'] = '$(inherited) "$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/PackageFrameworks"'
            end
          end

          def add_wireguard_spm(project, target)
            pkg = project.root_object.package_references&.find do |r|
              r.respond_to?(:repositoryURL) && r.repositoryURL == WG_URL
            end
            unless pkg
              pkg = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
              pkg.repositoryURL = WG_URL
              pkg.requirement   = { 'kind' => 'exactVersion', 'version' => WG_VERSION }
              project.root_object.package_references ||= []
              project.root_object.package_references << pkg
              puts 'WireGuardKit SPM reference added'
            end
            already = target.package_product_dependencies&.any? { |d| d.product_name == 'WireGuardKit' }
            unless already
              dep = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
              dep.package      = pkg
              dep.product_name = 'WireGuardKit'
              target.package_product_dependencies << dep
              puts 'WireGuardKit linked to PacketTunnel'
            end
          end

          def embed_extension(project, app_target, ext_target)
            phase = app_target.build_phases.find do |p|
              p.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) &&
                p.name == 'Embed App Extensions'
            end
            phase ||= app_target.new_copy_files_build_phase('Embed App Extensions')
            phase.dst_subfolder_spec = '13'
            ref = ext_target.product_reference
            unless phase.files_references.any? { |f| f == ref || f.path == ref.path }
              bf = phase.add_file_reference(ref)
              bf.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy', 'CodeSignOnCopy'] }
            end
            unless app_target.dependencies.any? { |d| d.target == ext_target }
              proxy = project.new(Xcodeproj::Project::Object::PBXContainerItemProxy)
              proxy.container_portal        = project.root_object.uuid
              proxy.proxy_type              = '1'
              proxy.remote_global_id_string = ext_target.uuid
              proxy.remote_info             = ext_target.name
              dep = project.new(Xcodeproj::Project::Object::PBXTargetDependency)
              dep.target       = ext_target
              dep.target_proxy = proxy
              app_target.dependencies << dep
            end
          end

          def remove_duplicate_fonts(project, target)
            fonts_group = project.main_group.find_subpath('Fonts', false)
            return unless fonts_group
            fonts_group.files.each do |file_ref|
              target.resources_build_phase.files.each do |build_file|
                if build_file.file_ref == file_ref
                  target.resources_build_phase.remove_build_file(build_file)
                  puts "Removed duplicate font: #{file_ref.path}"
                end
              end
            end
            fonts_group.remove_from_project
            puts 'Fonts group removed (CocoaPods handles fonts via RNVectorIcons)'
          end

          # ── main ──
          project     = Xcodeproj::Project.open('Nerox.xcodeproj')
          main_target = project.targets.find { |t| t.name == 'Nerox' }
          raise 'Nerox target not found' unless main_target

          configure_main(main_target)
          remove_duplicate_fonts(project, main_target)

          pkt_target = project.targets.find { |t| t.name == 'PacketTunnel' }
          if pkt_target
            puts 'PacketTunnel target exists — updating'
          else
            puts 'Creating PacketTunnel target'
            pkt_target = project.new_target(:app_extension, 'PacketTunnel', :ios, '15.0')
            grp  = project.main_group.new_group('PacketTunnel', 'PacketTunnel')
            file = grp.new_file('PacketTunnelProvider.swift')
            pkt_target.source_build_phase.add_file_reference(file)
          end

          configure_packet(pkt_target)
          add_wireguard_spm(project, pkt_target)
          embed_extension(project, main_target, pkt_target)
          project.save
          puts 'Done — project saved'
          RUBYSCRIPT

      # ─────────────────────────────────────────────
      # 4. Install CocoaPods
      # ─────────────────────────────────────────────
      - name: Install pods
        script: |
          cd ios
          NO_FLIPPER=1 pod install

      # ─────────────────────────────────────────────
      # 5. Code signing setup
      # ─────────────────────────────────────────────
      - name: Set up code signing
        script: |
          keychain initialize

          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12

          security import /tmp/certificate.p12 \
            -k ~/Library/Keychains/login.keychain-db \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
          || security import /tmp/certificate.p12 \
            -k /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" \
            ~/Library/Keychains/login.keychain-db 2>/dev/null || true

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" \
            /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null || true

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo $CM_PROVISIONING_PROFILE | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/4250a012-2d5e-4164-a0d9-3c6b59950937.mobileprovision"

          echo $CM_PROVISIONING_PROFILE_PACKETTUNNEL | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/ba9b8b32-6949-4963-a3a3-f3e7c6a50d94.mobileprovision"

          echo "Profiles installed:"
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ─────────────────────────────────────────────
      # 6. Export options plist
      # ─────────────────────────────────────────────
      - name: Create export options
        script: |
          cat > /tmp/export_options.plist << 'EXPORTOPTIONS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>6ZN7399P3U</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.reactjs.native.example.Nerox</key>
                  <string>4250a012-2d5e-4164-a0d9-3c6b59950937</string>
                  <key>org.reactjs.native.example.Nerox.PacketTunnel</key>
                  <string>ba9b8b32-6949-4963-a3a3-f3e7c6a50d94</string>
              </dict>
          </dict>
          </plist>
          EXPORTOPTIONS

      # ─────────────────────────────────────────────
      # 7. Build IPA  (resolve → patch → archive → export)
      # ─────────────────────────────────────────────
      - name: Build iOS IPA
        script: |
          set -e

          DERIVED_DATA="build/DerivedData"

          # ── 7a. Resolve SPM packages ──────────────────────────────────────
          echo "Resolving SPM packages..."
          xcodebuild \
            -workspace ios/Nerox.xcworkspace \
            -scheme Nerox \
            -resolvePackageDependencies \
            -derivedDataPath "$DERIVED_DATA"

          # ── 7b. Patch WireGuardKitC.h for Xcode 26 ───────────────────────
          echo "Patching WireGuardKitC.h for Xcode 26..."
          WG_HEADER=$(find "$DERIVED_DATA" -name "WireGuardKitC.h" 2>/dev/null | head -1)

          if [ -z "$WG_HEADER" ]; then
            echo "ERROR: WireGuardKitC.h not found after package resolve!"
            find "$DERIVED_DATA" -name "*.h" 2>/dev/null | grep -i wireguard || true
            exit 1
          fi

          echo "Found header: $WG_HEADER"
          if grep -q "sys/types.h" "$WG_HEADER"; then
            echo "Already patched — skipping"
          else
            sed -i '' '1s/^/#include <sys\/types.h>\n/' "$WG_HEADER"
            echo "Patched successfully"
            head -3 "$WG_HEADER"
          fi

          # ── 7c. Archive ───────────────────────────────────────────────────
          echo "Archiving..."
          xcodebuild \
            -workspace ios/Nerox.xcworkspace \
            -scheme Nerox \
            -configuration Release \
            -archivePath build/Nerox.xcarchive \
            -derivedDataPath "$DERIVED_DATA" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=6ZN7399P3U \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # ── 7d. Verify entitlements ───────────────────────────────────────
          echo "Main app entitlements:"
          codesign -d --entitlements :- \
            build/Nerox.xcarchive/Products/Applications/Nerox.app 2>/dev/null || true

          echo "PacketTunnel entitlements:"
          codesign -d --entitlements :- \
            build/Nerox.xcarchive/Products/Applications/Nerox.app/PlugIns/PacketTunnel.appex 2>/dev/null || true

          # ── 7e. Export IPA ────────────────────────────────────────────────
          echo "Exporting IPA..."
          xcodebuild \
            -exportArchive \
            -archivePath build/Nerox.xcarchive \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath build/ios/ipa

          echo "Build complete!"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false