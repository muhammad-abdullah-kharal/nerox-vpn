workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 20
      xcode: 26.4
      cocoapods: default
      groups:
        - deafault
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Increment build number
        script: |
          cd ios
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number 6770657257)
          NEXT=$((BUILD_NUMBER + 1))
          agvtool new-version -all $NEXT

      - name: Setup PacketTunnel Target
        script: |
          cd ios
          mkdir -p PacketTunnel

          cat > PacketTunnel/PacketTunnel.entitlements << 'ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.developer.networking.vpn.api</key>
              <array>
                  <string>allow-vpn</string>
              </array>
          </dict>
          </plist>
          ENTITLEMENTS

          cat > PacketTunnel/Info.plist << 'INFOPLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>PacketTunnel</string>
              <key>CFBundleName</key>
              <string>PacketTunnel</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundlePackageType</key>
              <string>XPC!</string>
              <key>NSExtension</key>
              <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.networkextension.packet-tunnel</string>
                  <key>NSExtensionPrincipalClass</key>
                  <string>$(PRODUCT_MODULE_NAME).PacketTunnelProvider</string>
              </dict>
          </dict>
          </plist>
          INFOPLIST

          cat > PacketTunnel/PacketTunnelProvider.swift << 'SWIFTFILE'
          import Foundation
          import NetworkExtension
          import WireGuardKit

          class PacketTunnelProvider: NEPacketTunnelProvider {
            private lazy var adapter = WireGuardAdapter(with: self) { logLevel, message in
              NSLog("[WireGuard] \(message)")
            }

            override func startTunnel(options: [String: NSObject]?, completionHandler: @escaping (Error?) -> Void) {
              guard
                let tunnelProtocol = protocolConfiguration as? NETunnelProviderProtocol,
                let providerConfig = tunnelProtocol.providerConfiguration,
                let wgQuickConfig = providerConfig["wgQuickConfig"] as? String,
                !wgQuickConfig.isEmpty
              else {
                completionHandler(PacketTunnelError.missingWireGuardConfig)
                return
              }
              let tunnelName = (providerConfig["tunnelName"] as? String) ?? "nerox"
              do {
                let tunnelConfiguration = try TunnelConfiguration(fromWgQuickConfig: wgQuickConfig, called: tunnelName)
                adapter.start(tunnelConfiguration: tunnelConfiguration) { error in
                  completionHandler(error)
                }
              } catch {
                completionHandler(error)
              }
            }

            override func stopTunnel(with reason: NEProviderStopReason, completionHandler: @escaping () -> Void) {
              adapter.stop { _ in completionHandler() }
            }

            override func handleAppMessage(_ messageData: Data, completionHandler: ((Data?) -> Void)?) {
              guard let messageString = String(data: messageData, encoding: .utf8) else {
                completionHandler?(nil); return
              }
              if messageString == "getTransferredByteCount" {
                adapter.getRuntimeConfiguration { configString in
                  guard let configString = configString else { completionHandler?(nil); return }
                  var totalRx: UInt64 = 0
                  var totalTx: UInt64 = 0
                  for line in configString.split(separator: "\n") {
                    let trimmed = line.trimmingCharacters(in: .whitespaces)
                    if trimmed.hasPrefix("rx_bytes=") { totalRx += UInt64(trimmed.dropFirst("rx_bytes=".count)) ?? 0 }
                    else if trimmed.hasPrefix("tx_bytes=") { totalTx += UInt64(trimmed.dropFirst("tx_bytes=".count)) ?? 0 }
                  }
                  if let jsonData = try? JSONSerialization.data(withJSONObject: ["totalReceived": totalRx, "totalSent": totalTx]) {
                    completionHandler?(jsonData)
                  } else { completionHandler?(nil) }
                }
              } else { completionHandler?(nil) }
            }
          }

          enum PacketTunnelError: LocalizedError {
            case missingWireGuardConfig
            var errorDescription: String? {
              switch self {
              case .missingWireGuardConfig: return "Missing wgQuickConfig in providerConfiguration"
              }
            }
          }
          SWIFTFILE

          gem install xcodeproj --quiet
          ruby << 'RUBYSCRIPT'
          require 'xcodeproj'

          TEAM_ID = '6ZN7399P3U'
          MAIN_BUNDLE_ID = 'org.reactjs.native.example.Nerox'
          PACKET_BUNDLE_ID = "#{MAIN_BUNDLE_ID}.PacketTunnel"
          MAIN_PROFILE = '4250a012-2d5e-4164-a0d9-3c6b59950937'
          PACKET_PROFILE = 'ba9b8b32-6949-4963-a3a3-f3e7c6a50d94'
          WIREGUARD_URL = 'https://git.zx2c4.com/wireguard-apple'
          WIREGUARD_VERSION = '1.0.15-26'

          def configure_main_target(target)
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = TEAM_ID
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = MAIN_BUNDLE_ID
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Nerox/Nerox.entitlements'
              config.build_settings['PROVISIONING_PROFILE'] = MAIN_PROFILE
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = MAIN_PROFILE
            end
          end

          def configure_packet_target(target)
            target.build_configurations.each do |config|
              config.build_settings['SWIFT_VERSION'] = '5.0'
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = TEAM_ID
              config.build_settings['PRODUCT_NAME'] = 'PacketTunnel'
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = PACKET_BUNDLE_ID
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'PacketTunnel/PacketTunnel.entitlements'
              config.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
              config.build_settings['INFOPLIST_FILE'] = 'PacketTunnel/Info.plist'
              config.build_settings['PROVISIONING_PROFILE'] = PACKET_PROFILE
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = PACKET_PROFILE
            end
          end

          def add_wireguard_spm(project, target)
            # Check if package already added
            existing_pkg = project.root_object.package_references&.find do |ref|
              ref.respond_to?(:repository_url) && ref.repository_url == WIREGUARD_URL
            end

            unless existing_pkg
              existing_pkg = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
              existing_pkg.repository_url = WIREGUARD_URL
              existing_pkg.requirement = { 'kind' => 'exactVersion', 'version' => WIREGUARD_VERSION }
              project.root_object.package_references ||= []
              project.root_object.package_references << existing_pkg
              puts 'WireGuardKit SPM package reference added!'
            end

            # Check if product dependency already added to target
            already_linked = target.package_product_dependencies&.any? do |dep|
              dep.product_name == 'WireGuardKit'
            end

            unless already_linked
              pkg_dep = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
              pkg_dep.package = existing_pkg
              pkg_dep.product_name = 'WireGuardKit'
              target.package_product_dependencies << pkg_dep
              puts 'WireGuardKit linked to PacketTunnel target!'
            end
          end

          def ensure_packet_tunnel_embedded(project, app_target, packet_target)
            embed_phase = app_target.build_phases.find do |phase|
              phase.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && phase.name == 'Embed App Extensions'
            end
            embed_phase ||= app_target.new_copy_files_build_phase('Embed App Extensions')
            embed_phase.dst_subfolder_spec = '13'

            extension_ref = packet_target.product_reference
            already_embedded = embed_phase.files_references.any? { |f| f == extension_ref || f.path == extension_ref.path }
            unless already_embedded
              build_file = embed_phase.add_file_reference(extension_ref)
              build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy', 'CodeSignOnCopy'] }
            end

            already_depends = app_target.dependencies.any? { |d| d.target == packet_target }
            unless already_depends
              container_proxy = project.new(Xcodeproj::Project::Object::PBXContainerItemProxy)
              container_proxy.container_portal = project.root_object.uuid
              container_proxy.proxy_type = '1'
              container_proxy.remote_global_id_string = packet_target.uuid
              container_proxy.remote_info = packet_target.name
              target_dependency = project.new(Xcodeproj::Project::Object::PBXTargetDependency)
              target_dependency.target = packet_target
              target_dependency.target_proxy = container_proxy
              app_target.dependencies << target_dependency
            end
          end

          project = Xcodeproj::Project.open('Nerox.xcodeproj')
          nerox_target = project.targets.find { |t| t.name == 'Nerox' }
          raise 'Nerox target not found' unless nerox_target

          configure_main_target(nerox_target)

          existing = project.targets.find { |t| t.name == 'PacketTunnel' }
          if existing
            configure_packet_target(existing)
            add_wireguard_spm(project, existing)
            ensure_packet_tunnel_embedded(project, nerox_target, existing)
            project.save
            puts 'PacketTunnel updated!'
          else
            target = project.new_target(:app_extension, 'PacketTunnel', :ios, '15.0')
            pt_group = project.main_group.new_group('PacketTunnel', 'PacketTunnel')
            pt_file = pt_group.new_file('PacketTunnelProvider.swift')
            target.source_build_phase.add_file_reference(pt_file)
            configure_packet_target(target)
            add_wireguard_spm(project, target)
            ensure_packet_tunnel_embedded(project, nerox_target, target)
            project.save
            puts 'PacketTunnel added and embedded!'
          end
          RUBYSCRIPT

      - name: Link Vector Icon Fonts to Xcode
        script: |
          cd ios
          gem install xcodeproj --quiet
          ruby << 'RUBYSCRIPT'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Nerox.xcodeproj')
          nerox_target = project.targets.find { |t| t.name == 'Nerox' }
          fonts_group = project.main_group.find_subpath('Fonts', true)
          fonts_group.set_source_tree('<group>')
          fonts_group.set_path('Fonts')
          fonts_dir = File.join(File.dirname(File.dirname(__FILE__)), 'ios', 'Fonts')
          Dir.glob("#{fonts_dir}/*.ttf").each do |font_path|
            font_name = File.basename(font_path)
            already_added = fonts_group.files.any? { |f| f.path == font_name }
            unless already_added
              file_ref = fonts_group.new_file(font_name)
              nerox_target.resources_build_phase.add_file_reference(file_ref)
              puts "Added font: #{font_name}"
            end
          end
          project.save
          puts "All fonts linked to Xcode project!"
          RUBYSCRIPT

      - name: Install pods
        script: |
          cd ios
          NO_FLIPPER=1 pod install

      - name: Set up code signing
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          echo "P12 file info:"
          ls -la /tmp/certificate.p12
          file /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k ~/Library/Keychains/login.keychain-db \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            || security import /tmp/certificate.p12 \
            -k /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null || true
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/4250a012-2d5e-4164-a0d9-3c6b59950937.mobileprovision"
          echo $CM_PROVISIONING_PROFILE_PACKETTUNNEL | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/ba9b8b32-6949-4963-a3a3-f3e7c6a50d94.mobileprovision"
          echo "Profiles installed:"
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Create export options
        script: |
          cat > /tmp/export_options.plist << 'EXPORTOPTIONS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>6ZN7399P3U</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.reactjs.native.example.Nerox</key>
                  <string>4250a012-2d5e-4164-a0d9-3c6b59950937</string>
                  <key>org.reactjs.native.example.Nerox.PacketTunnel</key>
                  <string>ba9b8b32-6949-4963-a3a3-f3e7c6a50d94</string>
              </dict>
          </dict>
          </plist>
          EXPORTOPTIONS

      - name: Build iOS IPA
        script: |
          xcodebuild \
            -workspace ios/Nerox.xcworkspace \
            -scheme Nerox \
            -configuration Release \
            -archivePath build/Nerox.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=6ZN7399P3U \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO
          echo "Main app signed entitlements:"
          codesign -d --entitlements :- build/Nerox.xcarchive/Products/Applications/Nerox.app 2>/dev/null || true
          echo "PacketTunnel signed entitlements:"
          codesign -d --entitlements :- build/Nerox.xcarchive/Products/Applications/Nerox.app/PlugIns/PacketTunnel.appex 2>/dev/null || true
          xcodebuild \
            -exportArchive \
            -archivePath build/Nerox.xcarchive \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false